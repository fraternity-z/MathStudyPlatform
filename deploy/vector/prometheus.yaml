global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/vector-alerts.yaml]
scrape_configs:
  - job_name: vector-worker
    scheme: https
    authorization:
      credentials_file: /run/secrets/worker-metrics-token
    tls_config:
      ca_file: /run/secrets/ca.crt
    static_configs:
      - targets: [vector-worker-1:8091, vector-worker-2:8091]
  - job_name: resource-api
    scheme: https
    tls_config:
      ca_file: /run/secrets/ca.crt
    static_configs:
      - targets: [resource-api.internal:8000]
  - job_name: vector-host
    static_configs:
      - targets: [vector-host.internal:9100]
alerting:
  alertmanagers:
    - scheme: https
      tls_config:
        ca_file: /run/secrets/ca.crt
      static_configs:
        - targets: [alertmanager.internal:9093]
