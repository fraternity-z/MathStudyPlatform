name: msp-vector-workers
x-worker: &worker
  image: ${VECTOR_WORKER_IMAGE:?set immutable backend image tag or digest}
  restart: unless-stopped
  init: true
  user: "1000:1000"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  tmpfs: ["/tmp:size=256m,noexec,nosuid,uid=1000,gid=1000"]
  stop_grace_period: 30s
  env_file: ["${VECTOR_RUNTIME_ENV:?set nonsecret runtime environment file}"]
  environment:
    ENVIRONMENT: production
    QDRANT_ENABLED: "true"
    QDRANT_CA_FILE: /run/secrets/ca.crt
    QDRANT_SHARD_NUMBER: "3"
    QDRANT_REPLICATION_FACTOR: "3"
    QDRANT_WRITE_CONSISTENCY_FACTOR: "2"
    QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    JWT_SECRET_KEY_FILE: /run/secrets/jwt_key
    ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    FERNET_SECRET_KEY_FILE: /run/secrets/fernet_key
    PGSSLMODE: verify-full
    PGSSLROOTCERT: /run/secrets/ca.crt
  command: ["msp-vector-worker", "run", "--concurrency=2", "--listen=0.0.0.0:8091", "--management-token-file=/run/secrets/worker_token", "--tls-cert=/run/secrets/tls.crt", "--tls-key=/run/secrets/tls.key"]
  secrets: [qdrant_api_key, postgres_password, jwt_key, admin_password, fernet_key, worker_token, ca.crt, tls.crt, tls.key]
  volumes: ["${VECTOR_OBJECT_DIR:?set private object directory}:/app/uploads"]
  networks: [vector, egress]
  healthcheck:
    disable: true
  deploy:
    resources:
      limits: {cpus: "2", memory: 1G, pids: 128}
services:
  vector-worker-1:
    <<: *worker
  vector-worker-2:
    <<: *worker
networks:
  vector:
    external: true
    name: msp-vector_vector
  egress:
secrets:
  qdrant_api_key:
    file: ${VECTOR_SECRET_DIR}/qdrant-api-key
  postgres_password:
    file: ${VECTOR_SECRET_DIR}/postgres-password
  jwt_key:
    file: ${VECTOR_SECRET_DIR}/jwt-key
  admin_password:
    file: ${VECTOR_SECRET_DIR}/admin-password
  fernet_key:
    file: ${VECTOR_SECRET_DIR}/fernet-key
  worker_token:
    file: ${VECTOR_SECRET_DIR}/worker-token
  ca.crt:
    file: ${VECTOR_SECRET_DIR}/ca.crt
  tls.crt:
    file: ${VECTOR_SECRET_DIR}/tls.crt
  tls.key:
    file: ${VECTOR_SECRET_DIR}/tls.key
